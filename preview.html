<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
background:#f4f6f9;
}

.card{
border:none;
border-radius:15px;
}

#reader{
width:100%;
max-width:500px;
margin:auto;
}

</style>

<body>

<div class="container py-4">

<h2 class="text-center mb-4">
Sistema de Gestión de Zapatillas
</h2>

<div class="row">

<div class="col-md-3">
<div class="card p-3 text-center">
<h4 id="totalProductos">0</h4>
<p>Productos</p>
</div>
</div>

<div class="col-md-3">
<div class="card p-3 text-center">
<h4 id="totalIngresos">0</h4>
<p>Ingresos QR</p>
</div>
</div>

<div class="col-md-3">
<div class="card p-3 text-center">
<button class="btn btn-success"
onclick="nuevoProducto()">
Nueva Marca
</button>
</div>
</div>

<div class="col-md-3">
<div class="card p-3 text-center">
<button class="btn btn-primary"
onclick="exportarJSON()">
Exportar JSON
</button>
</div>
</div>

</div>

<hr>

<div class="mb-3">

<input type="file"
id="importar"
class="form-control">

</div>

<div class="table-responsive">

<table class="table table-bordered table-striped">

<thead>

<tr>
<th>Marca</th>
<th>Proveedor</th>
<th>RUC</th>
<th>Fecha</th>
<th>Precio</th>
<th>Acciones</th>
</tr>

</thead>

<tbody id="tabla">

</tbody>

</table>

</div>

<hr>

<h4>Control de Ingresos por QR</h4>

<button
class="btn btn-dark mb-3"
onclick="abrirQR()">
Abrir Cámara
</button>

<div id="reader"></div>

<hr>

<h4>Historial de Ingresos</h4>

<table class="table table-bordered">

<thead>

<tr>
<th>QR</th>
<th>Fecha</th>
<th>Hora</th>
</tr>

</thead>

<tbody id="tablaAsistencia">

</table>

</div>

function guardar(){
localStorage.setItem(
"productos",
JSON.stringify(productos)
);

localStorage.setItem(
"asistencias",
JSON.stringify(asistencias)
);
}

function render(){

let html="";

productos.forEach((p,i)=>{

html+=`
<tr>
<td>${p.marca}</td>
<td>${p.proveedor}</td>
<td>${p.ruc}</td>
<td>${p.fecha}</td>
<td>S/. ${p.precio}</td>
<td>
<button class="btn btn-warning btn-sm"
onclick="editar(${i})">
Editar
</button>

<button class="btn btn-danger btn-sm"
onclick="eliminar(${i})">
Eliminar
</button>
</td>
</tr>
`;

});

document.getElementById("tabla").innerHTML=html;

document.getElementById("totalProductos")
.innerText=productos.length;

renderAsistencias();

guardar();

}

function renderAsistencias(){

let html="";

asistencias.forEach(a=>{

html+=`
<tr>
<td>${a.codigo}</td>
<td>${a.fecha}</td>
<td>${a.hora}</td>
</tr>
`;

});

document.getElementById("tablaAsistencia")
.innerHTML=html;

document.getElementById("totalIngresos")
.innerText=asistencias.length;

}

function nuevoProducto(){

Swal.fire({
title:'Nueva Marca',

html:`
<input id="marca" class="swal2-input" placeholder="Marca">
<input id="proveedor" class="swal2-input" placeholder="Proveedor">
<input id="ruc" class="swal2-input" placeholder="RUC">
<input id="fecha" type="date" class="swal2-input">
<input id="precio" type="number" class="swal2-input" placeholder="Precio">
`,

preConfirm:()=>{

productos.push({
marca:marca.value,
proveedor:proveedor.value,
ruc:ruc.value,
fecha:fecha.value,
precio:precio.value
});

render();

}

});

}

function editar(i){

let p=productos[i];

Swal.fire({

title:'Editar',

html:`
<input id="marca" class="swal2-input" value="${p.marca}">
<input id="proveedor" class="swal2-input" value="${p.proveedor}">
<input id="ruc" class="swal2-input" value="${p.ruc}">
<input id="fecha" type="date" class="swal2-input" value="${p.fecha}">
<input id="precio" class="swal2-input" value="${p.precio}">
`,

preConfirm:()=>{

productos[i]={
marca:marca.value,
proveedor:proveedor.value,
ruc:ruc.value,
fecha:fecha.value,
precio:precio.value
};

render();

}

});

}

function eliminar(i){

productos.splice(i,1);

render();

}

function exportarJSON(){

let data=JSON.stringify({
productos,
asistencias
});

let blob=new Blob(
[data],
{type:'application/json'}
);

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="backup.json";

a.click();

}

document.getElementById("importar")
.addEventListener("change",(e)=>{

let file=e.target.files[0];

let reader=new FileReader();

reader.onload=function(){

let datos=
JSON.parse(reader.result);

productos=datos.productos || [];
asistencias=datos.asistencias || [];

render();

};

reader.readAsText(file);

});

function abrirQR(){

const qr=new Html5Qrcode("reader");

qr.start(
{ facingMode:"environment" },
{ fps:10, qrbox:250 },

(texto)=>{

let ahora=new Date();

hora:ahora.toLocaleTimeString()

});

render();

qr.stop();

Swal.fire(
"Registrado",
texto,
"success"
);

}

);

}
